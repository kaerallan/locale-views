<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <!-- YouTube embeds need the page's referrer to identify the embedding site. -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Locale Views</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand"><span class="brand-dot"></span>Locale Views</div>
      <a href="stats.html">See locale results →</a>
    </header>

    <h1 id="title">Watch our video</h1>
    <p id="subtitle" class="sub"></p>

    <div id="notice" class="banner warn hidden"></div>

    <!-- Step 1: choose locale -->
    <section id="stepTown" class="card hidden">
      <form id="townForm">
        <label for="townSelect">Where are you watching from?</label>
        <select id="townSelect" required>
          <option value="" disabled selected>Choose your locale</option>
        </select>
        <div id="recentWrap" class="recent hidden">
          <span class="recent-label">Recent:</span>
          <span id="recentList" class="recent-list"></span>
        </div>
        <button id="townContinue" class="primary" type="submit" disabled>Continue to video</button>
      </form>
    </section>

    <!-- Step 2: watch -->
    <section id="stepWatch" class="hidden">
      <div class="video-shell"><div id="player"></div></div>

      <div class="card">
        <div class="town-line">
          <span>Watching from <strong id="townName"></strong></span>
          <button id="changeTown" class="link" type="button">change</button>
        </div>
        <div class="progress-head">
          <span>Watch time</span>
          <span id="progressText">0:00 / 15:00</span>
        </div>
        <div class="track"><div id="progressFill" class="fill"></div></div>
        <div id="status" class="status" role="status" aria-live="polite">Press play to start.</div>
        <div id="countedLine" class="status ok hidden" role="status" aria-live="polite"></div>
      </div>
    </section>

    <p id="loading" class="sub">Loading…</p>
  </div>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
